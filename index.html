<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voice Notes">
<title>Voice Notes</title>
<style>
:root{--bg:#f6f7f5;--fg:#14201a;--mut:#5d6b63;--panel:#ffffff;--line:#d9dfdb;--acc:#14724a;--accfg:#ffffff;--rec:#c43b2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--fg:#e6efe9;--mut:#93a39a;--panel:#16201a;--line:#27342c;--acc:#4cc98a;--accfg:#06150e;--rec:#ff6b5e}}
:root[data-theme="dark"]{--bg:#0e1511;--fg:#e6efe9;--mut:#93a39a;--panel:#16201a;--line:#27342c;--acc:#4cc98a;--accfg:#06150e;--rec:#ff6b5e}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:16px;gap:12px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
select{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#st{margin:0;color:var(--mut);font-size:15px;min-height:22px}
textarea{flex:1;min-height:180px;width:100%;resize:none;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:13px 10px;cursor:pointer}
#go{width:100%;background:var(--acc);color:var(--accfg);border-color:transparent;font-size:19px;padding:17px}
#go.rec{background:var(--rec);color:#fff}
#go:disabled{opacity:.5}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
</style>
</head>
<body>
<div class="top">
  <h1>Voice Notes</h1>
  <select id="lang" aria-label="Language">
    <option value="en-US">English</option>
    <option value="ro-RO">Română</option>
  </select>
</div>
<p id="st" aria-live="polite">Tap Start listening and allow the microphone.</p>
<textarea id="out" placeholder="Your words will appear here. You can also edit them."></textarea>
<button id="go">Start listening</button>
<div class="row">
  <button id="files">Save to Files</button>
  <button id="copy">Copy</button>
  <button id="clr">Clear</button>
</div>
<script>
const $=id=>document.getElementById(id);
const out=$('out'),st=$('st'),go=$('go');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false,finalText='';
try{finalText=localStorage.getItem('vn_text')||'';$('lang').value=localStorage.getItem('vn_lang')||'en-US'}catch(e){}
out.value=finalText;
function persist(){try{localStorage.setItem('vn_text',finalText)}catch(e){}}
function ui(r){go.classList.toggle('rec',r);go.textContent=r?'Stop listening':'Start listening'}
out.addEventListener('input',()=>{finalText=out.value;persist()});
$('lang').addEventListener('change',()=>{try{localStorage.setItem('vn_lang',$('lang').value)}catch(e){}if(on){stop();setTimeout(start,400)}});

function build(){
  rec=new SR();
  rec.continuous=true;rec.interimResults=true;rec.lang=$('lang').value;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){finalText+=(finalText&&!/\s$/.test(finalText)?' ':'')+r[0].transcript.trim();persist()}
      else interim+=r[0].transcript;
    }
    out.value=finalText+(interim?(finalText?' ':'')+interim:'');
    out.scrollTop=out.scrollHeight;
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      on=false;ui(false);
      st.textContent='Microphone is blocked. Allow it in Settings > Safari > Microphone, and turn on Siri & Dictation.';
    }
  };
  rec.onend=()=>{
    if(on){setTimeout(()=>{try{build();rec.start()}catch(e){}},150)}
    else{ui(false);out.value=finalText}
  };
}
function start(){
  finalText=out.value;on=true;ui(true);st.textContent='Listening… the screen will stay on.';lock();
  try{build();rec.start()}catch(e){on=false;ui(false);st.textContent='Could not start the microphone.'}
}
function stop(){on=false;ui(false);st.textContent='Stopped.';unlock();try{rec&&rec.stop()}catch(e){}out.value=finalText}

let wl=null;
async function lock(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function unlock(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(on&&document.visibilityState==='visible')lock()});

if(!SR){go.disabled=true;st.textContent='This browser can’t do speech recognition. Open this page in Safari on your iPhone.'}
go.addEventListener('click',()=>on?stop():start());

$('copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(out.value);st.textContent='Copied.'}
  catch(e){out.select();st.textContent='Select all and copy by hand.'}
});
$('clr').addEventListener('click',()=>{if(!out.value||confirm('Clear all text?')){finalText='';out.value='';persist();st.textContent='Cleared.'}});
$('files').addEventListener('click',async()=>{
  const t=out.value;if(!t.trim()){st.textContent='Nothing to save yet.';return}
  const name='notes-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.txt';
  const f=new File([t],name,{type:'text/plain'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});st.textContent='Choose “Save to Files” in the share sheet.';return}
  }catch(e){if(e.name==='AbortError')return}
  st.textContent='Saving isn’t available here. Use Copy and paste into Notes.';
});
</script>
</body>
</html>
